name: Build and Release
on: [tag]

jobs:
  build:
    name: Build for Windows and Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.1'

      - name: Get git tag and write version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "development")
          echo "$TAG" > internal/cli/version.tag

      - name: Build for Windows (x64)
        run: |
          GOOS=windows GOARCH=amd64 go build -o syncit.exe ./cmd/syncit
        env:
          CGO_ENABLED: 0

      - name: Build for Linux (amd64)
        run: |
          GOOS=linux GOARCH=amd64 go build -o syncit ./cmd/syncit
        env:
          CGO_ENABLED: 0

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-binaries
          path: |
            syncit
            syncit.exe